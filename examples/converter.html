<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency and gold converter</title>
</head>
<body>
<h1>Currency and gold converter</h1>

<!-- The converter: a currency converter and a gold value calculator in one card. It shows the link the API's terms
     ask for, and on your own machine (localhost, or this file opened from disk) it shows sample rates. -->
<div id="converter"></div>

<script type="module">
  import { mountConverter } from 'https://cdn.jsdelivr.net/npm/crystal-ball-markets@2/converter.js';
  mountConverter('#converter', { from: 'USD', to: 'EUR', theme: 'auto' });
</script>
</body>
</html>
