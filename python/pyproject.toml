[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-ball-markets"
version = "1.0.0"
description = "Free exchange rate and gold price API client: 60 currencies, gold price in 69 countries, live market quotes. No sign-up."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Crystal Ball Markets", email = "support@crystalballmarkets.com" }]
keywords = ["exchange rates", "currency", "forex", "gold price", "gold", "rates api", "free api", "market data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://crystalballmarkets.com/markets/rates-api"
Documentation = "https://crystalballmarkets.com/markets/rates-api"
Source = "https://github.com/cbmbusdev/rates-api-examples/tree/main/python"
Issues = "https://github.com/cbmbusdev/rates-api-examples/issues"

[tool.setuptools]
packages = ["crystal_ball_markets"]
