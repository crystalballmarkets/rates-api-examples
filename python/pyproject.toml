[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-ball-markets"
version = "2.0.0"
description = "Exchange rates, currency conversion and the value of gold by weight: a client for the free Crystal Ball Markets Rates API, the sums, and a command line."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Crystal Ball Markets", email = "support@crystalballmarkets.com" }]
keywords = ["exchange rates", "currency converter", "currency", "forex", "gold price", "gold calculator", "rates api", "free api", "market data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Office/Business :: Financial",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
cbm-rates = "crystal_ball_markets.__main__:main"

[project.urls]
Homepage = "https://crystalballmarkets.com/markets/rates-api"
Documentation = "https://crystalballmarkets.com/markets/rates-api"
Source = "https://github.com/crystalballmarkets/rates-api-examples/tree/main/python"
Issues = "https://github.com/crystalballmarkets/rates-api-examples/issues"

[tool.setuptools]
packages = ["crystal_ball_markets"]

[tool.setuptools.package-data]
crystal_ball_markets = ["py.typed"]
